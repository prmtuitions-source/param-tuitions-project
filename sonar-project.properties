## SonarQube / SonarCloud project configuration
# Replace placeholders where needed. Do NOT commit secrets (sonar.login token).
sonar.projectKey=param-tuitions
sonar.projectName=Param Tuitions Project
sonar.projectVersion=1.0
sonar.sources=src
sonar.exclusions=**/build/**,**/public/**,**/node_modules/**,**/*.test.js,**/*.spec.js
sonar.sourceEncoding=UTF-8

# If you want to run against SonarCloud, uncomment and set your org + host
# sonar.host.url=https://sonarcloud.io
# sonar.organization=YOUR_ORG

# Provide your token via env var or CI secret. DO NOT hard-code here.
# Example local run:
#   setx SONAR_TOKEN "<your_token>"
#   sonar-scanner -Dsonar.login=%SONAR_TOKEN%

# Optional: coverage report path
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
